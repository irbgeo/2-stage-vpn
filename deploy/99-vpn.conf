# Installed to /etc/sysctl.d by deploy/install.sh and deploy/exit/install.sh.
# Connection table of the NAT behind the VPN: the kernel sizes it from RAM
# (7680 on 1 GB), about 280 entries per active user -> full at ~25 users,
# then new connections are dropped. 65536 entries take ~20 MB.
net.netfilter.nf_conntrack_max = 65536
# Default 5 days: dead TCP connections of VPN users filled the table.
net.netfilter.nf_conntrack_tcp_timeout_established = 7200
# Routing of VPN clients (entry; the exit server sets it in exit-fw.sh as well).
net.ipv4.ip_forward = 1
# Loose: replies from awg-exit come from addresses the main table routes via
# eth0, strict mode would drop them.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
