# Installed to /etc/unbound/unbound.conf.d/vpn.conf by deploy/install.sh.
# DNS for VPN clients on 10.8.0.1. Upstream is DNS over TLS to Cloudflare;
# deploy/vpn.nft marks unbound's own queries, so they leave through the exit
# server (no DNS leak to the entry IP) and stop when the tunnel is down.
server:
	interface: 10.8.0.1
	# awg0 may come up after unbound
	ip-freebind: yes
	access-control: 0.0.0.0/0 refuse
	access-control: ::/0 refuse
	access-control: 10.8.0.0/22 allow
	# the tunnel is IPv4 only: an IPv6 query would leave from the entry IP
	do-ip6: no
	tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

forward-zone:
	name: "."
	forward-tls-upstream: yes
	forward-addr: 1.1.1.1@853#cloudflare-dns.com
	forward-addr: 1.0.0.1@853#cloudflare-dns.com
