# Installed to /etc/systemd/networkd.conf.d/vpn.conf by deploy/install.sh.
# By default systemd-networkd removes every ip rule and route it did not
# create whenever it (re)configures a link it manages: `netplan apply`,
# `networkctl reconfigure`, or a package upgrade that re-triggers eth0. That
# takes away the routing rule (fwmark 0x1 -> table 100) and its
# `unreachable` route. Checked on systemd 255: with these two lines a
# reconfigure keeps them.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
